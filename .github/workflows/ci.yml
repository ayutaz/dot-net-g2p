name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unity-meta-check:
    name: Unity .meta file integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check .meta files in UPM packages
        shell: bash
        run: |
          missing=0

          # UPM パッケージルートを検出（package.json があるディレクトリ）
          for pkg_dir in src/DotNetG2P.*/; do
            [ -f "$pkg_dir/package.json" ] || continue

            echo "::group::Checking $pkg_dir"

            # ファイルのチェック（.meta 自体と .gitkeep は除外）
            while IFS= read -r -d '' file; do
              if [ ! -f "$file.meta" ]; then
                echo "::error file=$file::Missing .meta file: $file.meta"
                missing=$((missing + 1))
              fi
            done < <(find "$pkg_dir" -type f ! -name '*.meta' ! -name '.gitkeep' -print0)

            # ディレクトリのチェック（パッケージルート自体は除外）
            while IFS= read -r -d '' dir; do
              if [ ! -f "$dir.meta" ]; then
                echo "::error file=$dir::Missing .meta file: $dir.meta"
                missing=$((missing + 1))
              fi
            done < <(find "$pkg_dir" -mindepth 1 -type d -print0)

            echo "::endgroup::"
          done

          if [ "$missing" -gt 0 ]; then
            echo "::error::$missing .meta file(s) missing. Unity requires a .meta for every file and directory in UPM packages."
            exit 1
          fi

          echo "All .meta files present."

  build-test-and-validate:
    name: Build/Test (${{ matrix.os }}, .NET ${{ matrix.dotnet_major }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            dotnet_version: '8.0.x'
            dotnet_major: '8'
            collect_coverage: false
            validate_pack: false
          - os: ubuntu-latest
            dotnet_version: '9.0.x'
            dotnet_major: '9'
            collect_coverage: true
            validate_pack: true
          - os: windows-latest
            dotnet_version: '8.0.x'
            dotnet_major: '8'
            collect_coverage: false
            validate_pack: false
          - os: windows-latest
            dotnet_version: '9.0.x'
            dotnet_major: '9'
            collect_coverage: false
            validate_pack: false
          - os: macos-latest
            dotnet_version: '8.0.x'
            dotnet_major: '8'
            collect_coverage: false
            validate_pack: false
          - os: macos-latest
            dotnet_version: '9.0.x'
            dotnet_major: '9'
            collect_coverage: false
            validate_pack: false
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.dotnet_version }}

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-dotnet-${{ matrix.dotnet_major }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'global.json') }}
          restore-keys: ${{ runner.os }}-dotnet-${{ matrix.dotnet_major }}-nuget-

      - name: Restore dependencies
        shell: pwsh
        run: |
          $projects = @(
            'tests/DotNetG2P.Tests/DotNetG2P.Tests.csproj',
            'tests/DotNetG2P.Benchmarks/DotNetG2P.Benchmarks.csproj',
            'tests/DotNetG2P.PublishSmoke/DotNetG2P.PublishSmoke.csproj',
            'samples/DotNetG2P.Console/DotNetG2P.Console.csproj',
            'tools/DotNetG2P.SpanishEval/DotNetG2P.SpanishEval.csproj',
            'tools/DotNetG2P.FrenchEval/DotNetG2P.FrenchEval.csproj',
            'tools/DotNetG2P.PortugueseEval/DotNetG2P.PortugueseEval.csproj'
          )

          foreach ($project in $projects) {
            dotnet restore $project
          }

      - name: Build
        shell: pwsh
        run: |
          $projects = @(
            'tests/DotNetG2P.Tests/DotNetG2P.Tests.csproj',
            'tests/DotNetG2P.Benchmarks/DotNetG2P.Benchmarks.csproj',
            'tests/DotNetG2P.PublishSmoke/DotNetG2P.PublishSmoke.csproj',
            'samples/DotNetG2P.Console/DotNetG2P.Console.csproj',
            'tools/DotNetG2P.SpanishEval/DotNetG2P.SpanishEval.csproj',
            'tools/DotNetG2P.FrenchEval/DotNetG2P.FrenchEval.csproj',
            'tools/DotNetG2P.PortugueseEval/DotNetG2P.PortugueseEval.csproj'
          )

          foreach ($project in $projects) {
            dotnet build $project --configuration Release --no-restore
          }

      - name: Setup dictionary
        uses: ./.github/actions/setup-dictionary

      - name: Test
        if: ${{ !matrix.collect_coverage }}
        run: >
          dotnet test tests/DotNetG2P.Tests/DotNetG2P.Tests.csproj
          --configuration Release
          --no-build
          --verbosity minimal
          --filter "Category!=Performance"
          --logger "trx;LogFileName=results.trx"
          --results-directory ./test-results

      - name: Test with coverage
        if: ${{ matrix.collect_coverage }}
        run: >
          dotnet test tests/DotNetG2P.Tests/DotNetG2P.Tests.csproj
          --configuration Release
          --no-build
          --verbosity minimal
          --filter "Category!=Performance"
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=results.trx"
          --results-directory ./test-results

      - name: Publish unit test results
        if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        continue-on-error: true
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: test-results/**/*.trx
          check_name: Test Results (${{ matrix.os }}, .NET ${{ matrix.dotnet_major }})
          comment_mode: "off"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}-dotnet-${{ matrix.dotnet_major }}
          path: ./test-results/
          retention-days: 30

      - name: Add .NET tools to PATH
        if: ${{ matrix.collect_coverage }}
        shell: bash
        run: echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Install ReportGenerator
        if: ${{ matrix.collect_coverage }}
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate coverage report
        if: ${{ matrix.collect_coverage }}
        run: >
          reportgenerator
          "-reports:test-results/**/coverage.cobertura.xml"
          "-targetdir:coverage-report"
          "-reporttypes:HtmlSummary;Cobertura;TextSummary"

      - name: Publish coverage summary
        if: ${{ matrix.collect_coverage }}
        shell: bash
        run: |
          echo "## Coverage Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Target: ${{ matrix.os }} / .NET ${{ matrix.dotnet_major }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat coverage-report/Summary.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Comment coverage summary on PR
        if: ${{ matrix.collect_coverage && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- dotnet-g2p-coverage-summary -->';
            const summary = fs.readFileSync('coverage-report/Summary.txt', 'utf8').trim();
            const body = [
              marker,
              '## Coverage Summary',
              '',
              'Target: ${{ matrix.os }} / .NET ${{ matrix.dotnet_major }}',
              '',
              '```text',
              summary,
              '```',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find((comment) =>
              comment.user.type === 'Bot' && comment.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Upload coverage report
        if: ${{ matrix.collect_coverage }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage-report/
          retention-days: 30

      - name: Restore local tools
        if: ${{ matrix.validate_pack }}
        run: dotnet tool restore

      - name: Build DocFX site
        if: ${{ matrix.validate_pack }}
        run: >
          dotnet tool run docfx docs/docfx.json
          --logLevel Warning
          --warningsAsErrors

      - name: Upload DocFX site
        if: ${{ matrix.validate_pack }}
        uses: actions/upload-artifact@v7
        with:
          name: docfx-site
          path: docs/_site/
          retention-days: 30

      - name: Restore publish smoke runtime assets
        if: ${{ matrix.validate_pack }}
        run: >
          dotnet restore tests/DotNetG2P.PublishSmoke/DotNetG2P.PublishSmoke.csproj
          -r linux-x64
          -p:DotNetG2PPublishAotSmoke=true
          -p:BuildProjectReferences=false

      - name: Publish trim smoke test
        if: ${{ matrix.validate_pack }}
        shell: bash
        run: |
          dotnet publish tests/DotNetG2P.PublishSmoke/DotNetG2P.PublishSmoke.csproj \
            --configuration Release \
            --framework net8.0 \
            --runtime linux-x64 \
            --self-contained true \
            -p:DotNetG2PPublishTrimmedSmoke=true \
            -p:BuildProjectReferences=false \
            --no-restore \
            -o ./artifacts/publish-smoke/trim
          ./artifacts/publish-smoke/trim/DotNetG2P.PublishSmoke

      - name: Publish AOT smoke test
        if: ${{ matrix.validate_pack }}
        shell: bash
        run: |
          dotnet publish tests/DotNetG2P.PublishSmoke/DotNetG2P.PublishSmoke.csproj \
            --configuration Release \
            --framework net8.0 \
            --runtime linux-x64 \
            --self-contained true \
            -p:DotNetG2PPublishAotSmoke=true \
            -p:BuildProjectReferences=false \
            --no-restore \
            -o ./artifacts/publish-smoke/aot
          ./artifacts/publish-smoke/aot/DotNetG2P.PublishSmoke

      - name: Pack
        if: ${{ matrix.validate_pack }}
        run: |
          dotnet pack src/DotNetG2P.Core/DotNetG2P.Core.csproj --configuration Release --no-build -p:EnablePackageValidation=true --output ./artifacts
          dotnet pack src/DotNetG2P.MeCab/DotNetG2P.MeCab.csproj --configuration Release --no-build -p:EnablePackageValidation=true --output ./artifacts
          dotnet pack src/DotNetG2P.English/DotNetG2P.English.csproj --configuration Release --no-build -p:EnablePackageValidation=true --output ./artifacts
          dotnet pack src/DotNetG2P.Chinese/DotNetG2P.Chinese.csproj --configuration Release --no-build -p:EnablePackageValidation=true --output ./artifacts
          dotnet pack src/DotNetG2P.Korean/DotNetG2P.Korean.csproj --configuration Release --no-build -p:EnablePackageValidation=true --output ./artifacts
          dotnet pack src/DotNetG2P.Spanish/DotNetG2P.Spanish.csproj --configuration Release --no-build -p:EnablePackageValidation=true --output ./artifacts
          dotnet pack src/DotNetG2P.French/DotNetG2P.French.csproj --configuration Release --no-build -p:EnablePackageValidation=true --output ./artifacts
          dotnet pack src/DotNetG2P.Portuguese/DotNetG2P.Portuguese.csproj --configuration Release --no-build -p:EnablePackageValidation=true --output ./artifacts
          dotnet pack src/DotNetG2P.Multilingual/DotNetG2P.Multilingual.csproj --configuration Release --no-build -p:EnablePackageValidation=true --output ./artifacts

      - name: Generate SBOM
        if: ${{ matrix.validate_pack }}
        run: >
          dotnet tool run dotnet-CycloneDX DotNetG2P.slnx
          -o ./artifacts/sbom
          -t
          --disable-hash-computation

      - name: Upload NuGet packages
        if: ${{ matrix.validate_pack }}
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages-validation
          path: artifacts/*.nupkg

      - name: Upload SBOM
        if: ${{ matrix.validate_pack }}
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: artifacts/sbom/
          retention-days: 30
