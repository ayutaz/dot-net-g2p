name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore DotNetG2P.slnx

      - name: Build
        run: dotnet build DotNetG2P.slnx --configuration Release -p:Version=${{ inputs.version }}

      - name: Test
        run: dotnet test DotNetG2P.slnx --configuration Release --no-build --verbosity normal

      - name: Pack DotNetG2P
        run: dotnet pack src/DotNetG2P.Core/DotNetG2P.Core.csproj --configuration Release --no-build -p:PackageVersion=${{ inputs.version }} --output ./artifacts

      - name: Pack DotNetG2P.NMeCab
        run: dotnet pack src/DotNetG2P.NMeCab/DotNetG2P.NMeCab.csproj --configuration Release --no-build -p:PackageVersion=${{ inputs.version }} --output ./artifacts

      - name: Push to NuGet
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v${{ inputs.version }}" ./artifacts/*.nupkg --title "v${{ inputs.version }}" --generate-notes
